<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ApexOrchastrator</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0b0d12; color: #e6e8ee; margin: 0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  select { background: #171a21; color: #e6e8ee; border: 1px solid #2a2e38; border-radius: 6px; padding: 6px 10px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #1e222b; font-size: 13px; }
  th { color: #8b90a0; font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pending { background: #1e222b; color: #6b7280; }
  .running { background: #3a2f0b; color: #fbbf24; }
  .ok { background: #0b3a1e; color: #34d399; }
  .mocked { background: #0b2e3a; color: #22d3ee; }
  .failed, .skipped { background: #3a0b0b; color: #f87171; }
  .detail { color: #8b90a0; }
  #empty { color: #6b7280; margin-top: 40px; }
</style>
</head>
<body>
<h1>ApexOrchastrator &mdash; live pipeline runs</h1>
<select id="runPicker"></select>
<table id="stageTable">
  <thead><tr><th>Stage</th><th>Status</th><th>Detail</th></tr></thead>
  <tbody id="stageBody"></tbody>
</table>
<div id="empty" style="display:none">No runs yet. Start one with: <code>python -m apex_orchestrator.cli --topic "..."</code></div>

<script>
const STAGE_ORDER = [
  "ugc.script", "ugc.voiceover", "ugc.broll", "ugc.captions", "ugc.assemble",
  "qc.hook_score", "qc.brand_safety", "qc.disclosure", "qc.copyright",
  "publish.youtube_shorts", "publish.tiktok", "publish.instagram",
];

let currentRun = null;

async function refreshRunList() {
  const res = await fetch("/api/runs");
  const runs = await res.json();
  const picker = document.getElementById("runPicker");
  const empty = document.getElementById("empty");
  const table = document.getElementById("stageTable");

  if (runs.length === 0) {
    empty.style.display = "block";
    table.style.display = "none";
    return;
  }
  empty.style.display = "none";
  table.style.display = "table";

  const prevSelection = picker.value;
  picker.innerHTML = runs.map(r => `<option value="${r}">${r}</option>`).join("");
  if (runs.includes(prevSelection)) {
    picker.value = prevSelection;
  }
  currentRun = picker.value;
}

function renderStages(events) {
  const state = {};
  for (const s of STAGE_ORDER) state[s] = { status: "pending", detail: "" };
  for (const e of events) {
    state[e.stage] = { status: e.status, detail: e.message };
  }
  const body = document.getElementById("stageBody");
  body.innerHTML = STAGE_ORDER.map(stage => {
    const { status, detail } = state[stage];
    return `<tr><td>${stage}</td><td><span class="status ${status}">${status}</span></td><td class="detail">${detail}</td></tr>`;
  }).join("");
}

async function refreshEvents() {
  if (!currentRun) return;
  const res = await fetch(`/api/runs/${currentRun}/events`);
  if (!res.ok) return;
  const events = await res.json();
  renderStages(events);
}

document.getElementById("runPicker").addEventListener("change", (e) => {
  currentRun = e.target.value;
  refreshEvents();
});

async function tick() {
  await refreshRunList();
  await refreshEvents();
}

tick();
setInterval(tick, 1500);
</script>
</body>
</html>
